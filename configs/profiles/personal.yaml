profile:
  name: personal
  description: >-
    Web, API, backend, cloud, infrastructure, and codebase research.
    Crypto platforms are in scope when their attack surface is ordinary
    software. Pure smart-contract and protocol research is not.

  access:
    # Highest reputation requirement worth submitting to.
    max_reputation_points: 80
    # Highest submission fee worth paying.
    max_submission_fee_usd: 5
    # Whether identity verification is acceptable. "no" is a deliberate
    # choice: KYC-gated programs are unreachable without it.
    kyc_required: no
    # Never auto-accept programs whose access facts could not be parsed.
    accept_unknown_access_gates: false
    # Never auto-accept programs the adapter could not fully understand.
    accept_unknown_parse_state: false

  platforms:
    hackenproof: true

  target_domains:
    included:
      - web_application
      - api
      - backend
      - cloud
      - infrastructure
      - codebase
      - web2
    # Surfaces that disqualify a program when they dominate its scope.
    # Left empty deliberately: the veto is driven by crypto traits instead,
    # because a mobile-only program is still worth surfacing if it is new.
    excluded: []
    # Share of a program's surfaces that must be excluded for the veto to fire.
    exclude_dominance_ratio: 0.8

  crypto:
    enabled: true
    # auto          - apply the allow and exclude lists below
    # off           - treat every crypto program identically, no crypto filtering
    # only          - only crypto programs matter
    # platform_only - only crypto programs with platform character matter
    mode: auto

    # A crypto program must carry at least one of these traits. Without this,
    # every crypto program would qualify, which is exactly the noise to avoid.
    require_allowed_trait: true
    allowed:
      - crypto_platform
      - exchange
      - wallet_platform
      - fintech_crypto
      - crypto_web_application
      - crypto_api
      - crypto_backend
      - crypto_infrastructure

    # These traits veto a program when they dominate its crypto classification.
    excluded:
      - smart_contract_only
      - solidity_only
      - protocol_consensus
      - blockchain_core_protocol
      - cryptographic_primitive_research

    # A crypto exchange with one smart-contract scope is not a smart-contract
    # program. The veto only fires when excluded traits reach this share of the
    # program's crypto traits.
    dominance_ratio: 0.6

  program_states:
    # Programs worth alerting on.
    allowed:
      - live
      - new
    # States that warrant an alert in their own right.
    alert_on_state:
      - live
      - new

  # Coverage accounting. A sweep that stops seeing programs the system already
  # knew about is the failure mode that matters most: any change to an unobserved
  # program is undetectable, and without this the scan would report success while
  # watching nothing.
  coverage:
    # Fraction of known programs that must be observed for a sweep to be trusted.
    # 0.9 absorbs one dropped listing page of a roughly thirty-page sweep while
    # still catching the order-of-magnitude losses that mean the sweep is broken.
    min_ratio: 0.9
    # Consecutive sweeps a program may be missing before its absence is a fact
    # rather than a transient. One is the minimum that separates a network failure
    # from a departure.
    grace_sweeps: 2
    evict_departed: true

  freshness:
    # Below this age a newly seen program is treated as brand new.
    fresh_program_window: 168h
    # Below this age a scope change is treated as recent.
    fresh_scope_window: 168h
    # Beyond this age a program's base priority decays.
    stale_program_age: 8760h

  notifications:
    enabled: true
    min_severity: medium

    # Hard gate. A program that fails any access requirement is never
    # announced, regardless of how new it is or how well it matches. This is the
    # single most important setting in the profile.
    require_eligible: true

    # Only newly launched programs are worth interrupting for.
    alert_on_new_programs: true
    new_program_window: 24h

    # A program the monitor could not assess, and now can, is still a fresh
    # launch worth reporting. This trigger is window-gated, so it can only ever
    # fire for something newly launched.
    alert_on_newly_eligible: true

    # Changes to programs that already existed. These are gated on the recency of
    # the CHANGE, not on the age of the program: a five-year-old program that
    # added an API nine minutes ago is the most valuable event this system can
    # report, and a launch-age gate could never express it.
    alert_on_material_change: true
    alert_on_scope_expansion: true

    # Recency windows for each class of change, resolved as
    # per-kind -> class -> default.
    change_windows:
      default: 72h
      scope_expansion: 72h
      access_improved: 168h
      reactivated: 72h
      # Zero keeps each scan transition as its own window; changes detected
      # together still share a window and keep their individual deltas.
      bundle_window: 0s
      # Match the widest trigger window above. If omitted, Hunter derives this
      # from the widest configured change window so an alertable window is not
      # expired before its own trigger window ends.
      max_age: 168h
      # Submission counts are a noisy proxy for competition, so crowding is
      # disabled until a researcher chooses an evidence-based threshold.
      max_post_change_submissions: 0

    # Guard the channel if several programs change at once. 0 means no cap.
    max_per_scan: 10
    subject_prefix: "[HUNTER]"

  scan:
    per_page: 10
    # 0 traverses the whole listing.
    max_pages: 0
    fetch_details: true
    # Two-tier read. Every program is swept from the cheap listing page on every
    # scan; the detail page is read only when the listing reports something
    # different, so a five-minute cadence stays affordable and polite.
    fetch_details_on_listing_change: true
    # Longest a detail record may go unrefreshed. This bounds how long a change
    # the listing does not expose can go unnoticed.
    details_refresh_interval: 24h
    request_timeout: 45s
    max_retries: 3
    retry_base_delay: 2s
    max_retry_delay: 30s
    # Pacing floor. The adapter declares what the host tolerates and this value is
    # raised to meet it if it is tighter, so a politeness setting here cannot
    # become a rate-limit generator there. Discovery runs every scan over the whole
    # catalogue, which makes it the request pattern that draws a 429 - and a 429
    # costs coverage silently, which is what the coverage accounting now catches.
    min_request_interval: 750ms
    max_concurrent: 4

    # Listing pages fetched in parallel during discovery. Zero uses the adapter's
    # declared limit, which is the safe default: an adapter knows its host better
    # than a profile does.
    listing_concurrency: 0

    # Cap on catch-up detail reads per scan. Applies to initial bootstrap reads
    # and stale-interval refreshes. Does not throttle listing changes, incomplete
    # records, or parse retries. Zero means unlimited. 75 spreads a 324-program
    # catch-up across roughly five sweeps.
    max_catch_up_detail_fetches_per_scan: 75

  sources:
    hackenproof:
      enabled: true