name: release

# Builds portable binaries. No package registry, no publishing pipeline: the
# artifacts are attached to a tag so they can be downloaded directly.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: false
        default: "dev"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test before building
        run: go test -count=1 ./...

      - name: Build binaries
        # Static binaries for the platforms worth running this on. Each target is
        # built with its own GOOS/GOARCH so the artifact is directly usable.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%%/*}"
            arch="${target##*/}"
            out="dist/hunter_${os}_${arch}"
            if [ "$os" = "windows" ]; then out="${out}.exe"; fi

            # -trimpath removes local filesystem paths from the binary, which
            # keeps it reproducible and leaks nothing about the build machine.
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$out" ./cmd/hunter

            # Reproducibility check: building twice must produce identical bytes.
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$version" -o "${out}.repeat" ./cmd/hunter
            if ! cmp -s "$out" "${out}.repeat"; then
              echo "::error::build for $target is not reproducible"
              exit 1
            fi
            rm -f "${out}.repeat"
          done

          ls -la dist/

      - name: Smoke test the Linux binary
        run: |
          set -euo pipefail
          ./dist/hunter_linux_amd64 version
          ./dist/hunter_linux_amd64 validate-config
          ./dist/hunter_linux_amd64 test-fixtures

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hunter-binaries
          path: dist/
          if-no-files-found: error

      - name: Checksums
        run: |
          cd dist
          sha256sum hunter_* > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Attach binaries to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            SHA256SUMS
