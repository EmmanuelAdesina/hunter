name: monitor

# The scheduler for the monitoring system.
#
# The binary is a single-shot worker: it performs one scan, records what it saw,
# optionally sends email, and exits. There is no server and no long-lived job, so
# this workflow is the entire runtime.
#
# Credentials come only from repository secrets and are passed as environment
# variables for the single step that needs them. Nothing is ever written to disk
# or to the repository.

on:
  # There is deliberately no schedule here.
  #
  # GitHub's scheduled-workflow trigger was measured firing once every three to
  # five hours against a five-minute cron, roughly 42 times less often than
  # configured, and that delay is in the dispatcher rather than in the runner, so
  # moving the job to a self-hosted runner would not have fixed it. A host-local
  # systemd timer is the scheduler instead; see deploy/ in the repository.
  #
  # Running both would also be actively harmful: this workflow uses the state
  # committed in the repository, while a host-local timer keeps its own state
  # directory. Two independent stores each believe an alert is undelivered, so
  # the same opportunity would be emailed twice.
  workflow_dispatch:
    inputs:
      full:
        description: "Traverse the whole listing rather than the profile default"
        type: boolean
        default: false
      dry_run:
        description: "Generate and record alerts without sending email"
        type: boolean
        default: true

# GitHub cancels a run still in progress when the next one starts. Cancelling
# mid-scan is safe by design - state is written atomically - but overlapping runs
# would still send duplicate work, so the older run is stopped explicitly.
concurrency:
  group: hunter-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    # A stale checkout would compare against out-of-date state, so a scan is
    # never run against stale data.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build once
        # The binary is built a single time and reused. Three separate "go run"
        # invocations would resolve and link the same program three times, which
        # is wasted work on a schedule that runs hundreds of times a day.
        run: go build -o "$RUNNER_TEMP/hunter" ./cmd/hunter

      - name: Verify the profile and the parser
        # Both checks run before any live request is made, so a broken profile or
        # a parser regression can never be mistaken for "no opportunities".
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hunter" validate-config
          "$RUNNER_TEMP/hunter" test-fixtures

      - name: Run scan
        env:
          HUNTER_FULL: ${{ github.event.inputs.full || 'false' }}
          HUNTER_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
        run: |
          set -euo pipefail

          args=(scan)
          if [ "$HUNTER_FULL" = "true" ]; then args+=(--full); fi
          if [ "$HUNTER_DRY_RUN" = "true" ]; then args+=(--dry-run); fi

          # Exit code 3 means the scan ran but its results are untrustworthy.
          # That is reported as a failure on purpose: silence from a degraded
          # scan must not be mistaken for an absence of opportunities, and the
          # state commit is deliberately skipped in that case so a broken run
          # cannot overwrite a good baseline.
          set +e
          "$RUNNER_TEMP/hunter" "${args[@]}"
          code=$?
          set -e

          if [ "$code" -eq 3 ]; then
            echo "::warning::scan completed but its results are untrustworthy; state was not committed"
          fi
          exit "$code"

      - name: Commit updated state
        # State is the record of what has been seen, so it is committed after a
        # successful scan. Nothing else is written by a scan.
        #
        # The comparison is against the material digest rather than the whole
        # directory. Every scan rewrites last-seen times and scan metadata, so
        # comparing the directory would commit on every run and bury the commits
        # that actually record something the system learned. The digest covers
        # only what can change a future decision.
        if: success()
        run: |
          set -euo pipefail

          if git diff --quiet -- state/material.sha256; then
            echo "nothing material changed; not committing"
            exit 0
          fi

          git config user.name  "hunter-bot"
          git config user.email "hunter-bot@users.noreply.github.com"
          git add state/

          if git diff --cached --quiet; then
            echo "no staged changes; not committing"
            exit 0
          fi

          summary="$(git diff --cached --stat -- state/ | tail -n 1)"
          git commit -m "state: scan ${GITHUB_RUN_ID} at $(date -u +%Y%m%dT%H%M%SZ)

          ${summary}"

          # A push failure is reported but does not fail the scan: the alert has
          # already been sent and losing state is recoverable, whereas retrying
          # the whole scan would risk duplicate mail.
          git push || echo "::warning::could not push state; the next run will re-derive it"
